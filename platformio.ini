; PlatformIO project — BertRCController (ESP32-WROOM-32, arduino-esp32 3.x)
;
; arduino-esp32 3.x is REQUIRED (analogContinuous(), ledcAttach()). The official
; espressif32 platform historically shipped core 2.x, so we use the pioarduino fork.
; If this platform URL/tag is stale, grab a newer one from:
;   https://github.com/pioarduino/platform-espressif32/releases
; After the first build, confirm the resolved core is 3.x (see the note in CLAUDE.md).

[platformio]
default_envs = esp32   ; plain `pio run` / upload stays the standard (landscape) build

[env:esp32]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    robtillaart/INA226 @ ^0.6.0
    adafruit/Adafruit MCP23017 Arduino Library @ ^2.3.2
    ; BLE HID gamepad (FPV-sim mode). Uses NimBLE 2.x for arduino-esp32 3.x / IDF5.
    https://github.com/lemmingDev/ESP32-BLE-Gamepad.git
    h2zero/NimBLE-Arduino @ ^2.2.1

build_flags =
    ; ---- TFT_eSPI: configure here so it lives in the repo (do NOT edit User_Setup.h) ----
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_RGB_ORDER=TFT_BGR   ; panel is BGR — without this red<->blue are swapped
    ; Keep the FULL controller GRAM as the coordinate space; ui.cpp carves out the
    ; visible 76x284 strip with a viewport (offsets live in src/display_cfg.h).
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=-1
    -DTFT_MOSI=23
    -DTFT_SCLK=18
    -DTFT_CS=5
    -DTFT_DC=19
    -DTFT_RST=4
    ; Backlight (GPIO27) is driven manually via LEDC in ui.cpp, so TFT_BL is left unset.
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=40000000
    ; VSPI is TFT_eSPI's default bus on ESP32 (matches pins 18/23/5) — no flag needed.

; ---- POCKETVERSION: same firmware, portrait display (76x284, rotation 0). ----
; Build/flash with `pio run -e pocket [-t upload]`. The define flips the panel rotation
; in src/display_cfg.h; ui.cpp lays every screen out for the portrait surface.
[env:pocket]
extends = env:esp32
build_flags =
    ${env:esp32.build_flags}
    -DPOCKETVERSION=1
